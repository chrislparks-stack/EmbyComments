<!DOCTYPE html>
<html>
<head>
    <title>Comments</title>
    <style>
        .embycomments-container {
            padding: 1em;
            max-width: 800px;
        }
        .embycomments-form {
            margin-bottom: 2em;
        }
        .embycomments-form textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: inherit;
            padding: 0.5em;
            font-size: 1em;
            resize: vertical;
            box-sizing: border-box;
        }
        .embycomments-stars {
            display: flex;
            gap: 4px;
            margin: 0.5em 0;
            cursor: pointer;
        }
        .embycomments-stars span {
            font-size: 1.5em;
            color: rgba(255,255,255,0.3);
            transition: color 0.1s;
        }
        .embycomments-stars span.active {
            color: #f5c518;
        }
        .embycomments-submit {
            margin-top: 0.5em;
            padding: 0.5em 1.5em;
            background: #00a4dc;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 1em;
        }
        .embycomments-submit:hover { background: #0085b2; }
        .embycomments-list {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        .embycomments-comment {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 1em;
            border-left: 3px solid #00a4dc;
        }
        .embycomments-comment.reply {
            margin-left: 2em;
            border-left-color: rgba(255,255,255,0.2);
        }
        .embycomments-comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5em;
        }
        .embycomments-author { font-weight: bold; color: #00a4dc; }
        .embycomments-date { font-size: 0.8em; color: rgba(255,255,255,0.5); }
        .embycomments-rating { color: #f5c518; font-size: 0.9em; margin-bottom: 0.25em; }
        .embycomments-body { line-height: 1.5; }
        .embycomments-actions {
            display: flex;
            gap: 1em;
            margin-top: 0.75em;
        }
        .embycomments-action-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 0.85em;
            padding: 0;
        }
        .embycomments-action-btn:hover { color: #00a4dc; }
        .embycomments-action-btn.liked { color: #00a4dc; }
        .embycomments-reply-form {
            margin-top: 0.75em;
            display: none;
        }
        .embycomments-reply-form textarea {
            width: 100%;
            min-height: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: inherit;
            padding: 0.5em;
            font-size: 0.9em;
            resize: vertical;
            box-sizing: border-box;
        }
        .embycomments-empty {
            color: rgba(255,255,255,0.4);
            text-align: center;
            padding: 2em;
        }
        .embycomments-error {
            color: #ff4444;
            padding: 1em;
            background: rgba(255,0,0,0.1);
            border-radius: 4px;
            margin-bottom: 1em;
        }
    </style>
</head>
<body>
    <div class="embycomments-container">
        <div id="embyCommentError" class="embycomments-error" style="display:none"></div>
        <div class="embycomments-form">
            <div class="embycomments-stars" id="starRating">
                <span data-value="1">★</span><span data-value="2">★</span>
                <span data-value="3">★</span><span data-value="4">★</span>
                <span data-value="5">★</span><span data-value="6">★</span>
                <span data-value="7">★</span><span data-value="8">★</span>
                <span data-value="9">★</span><span data-value="10">★</span>
            </div>
            <textarea id="commentBody" placeholder="Share your thoughts..."></textarea>
            <br>
            <button class="embycomments-submit" id="submitComment">Post Comment</button>
        </div>
        <div id="commentsList" class="embycomments-list">
            <div class="embycomments-empty">Loading comments...</div>
        </div>
    </div>
    <script>
        var selectedRating = 0;
        var currentMediaKey = null;
        var serverGuid = null;
        var displayName = null;
        var apiEndpoint = null;

        window.EmbyComments = {
            init: function(item, config) {
                apiEndpoint = config.ApiEndpoint;
                displayName = config.DisplayName;
                serverGuid = ApiClient.serverId();
                currentMediaKey = getMediaKey(item);
                setupStars();
                setupSubmit();
                loadComments();
            }
        };

        function getMediaKey(item) {
            if (item.ProviderIds) {
                if (item.ProviderIds.Imdb) return 'imdb:' + item.ProviderIds.Imdb;
                if (item.ProviderIds.Tmdb) return 'tmdb:' + item.ProviderIds.Tmdb;
                if (item.ProviderIds.Tvdb) return 'tvdb:' + item.ProviderIds.Tvdb;
            }
            return 'emby:' + item.Id;
        }

        function setupStars() {
            var stars = document.querySelectorAll('#starRating span');
            stars.forEach(function(star) {
                star.addEventListener('mouseover', function() {
                    var val = parseInt(this.dataset.value);
                    stars.forEach(function(s) {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= val);
                    });
                });
                star.addEventListener('mouseout', function() {
                    stars.forEach(function(s) {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
                    });
                });
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.value);
                    stars.forEach(function(s) {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
                    });
                });
            });
        }

        function setupSubmit() {
            document.getElementById('submitComment').addEventListener('click', function() {
                var body = document.getElementById('commentBody').value.trim();
                if (!body) return;
                if (!displayName) {
                    showError('Please set your display name in plugin settings first.');
                    return;
                }
                var comment = {
                    MediaKey: currentMediaKey,
                    MediaTitle: '',
                    AuthorDisplayName: displayName,
                    OriginServerGuid: serverGuid,
                    Body: body,
                    StarRating: selectedRating > 0 ? selectedRating : null,
                    ParentCommentId: null
                };
                fetch(apiEndpoint + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(comment)
                }).then(function() {
                    document.getElementById('commentBody').value = '';
                    selectedRating = 0;
                    document.querySelectorAll('#starRating span').forEach(function(s) { s.classList.remove('active'); });
                    loadComments();
                }).catch(function(err) { showError('Failed to post: ' + err.message); });
            });
        }

        function loadComments() {
            if (!currentMediaKey || !apiEndpoint) return;
            fetch(apiEndpoint + '/comments?mediaKey=' + encodeURIComponent(currentMediaKey))
                .then(function(r) { return r.json(); })
                .then(function(comments) { renderComments(comments); })
                .catch(function(err) { showError('Failed to load comments: ' + err.message); });
        }

        function renderComments(comments) {
            var list = document.getElementById('commentsList');
            if (!comments || comments.length === 0) {
                list.innerHTML = '<div class="embycomments-empty">No comments yet. Be the first!</div>';
                return;
            }
            var topLevel = comments.filter(function(c) { return !c.ParentCommentId; });
            var replies = comments.filter(function(c) { return c.ParentCommentId; });
            list.innerHTML = topLevel.map(function(c) {
                var commentReplies = replies.filter(function(r) { return r.ParentCommentId === c.CommentId; });
                return renderComment(c) + commentReplies.map(function(r) { return renderComment(r, true); }).join('');
            }).join('');
            list.querySelectorAll('.embycomments-like-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    fetch(apiEndpoint + '/likes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ CommentId: this.dataset.id, ServerGuid: serverGuid })
                    }).then(function() { loadComments(); });
                });
            });
            list.querySelectorAll('.embycomments-reply-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var form = document.getElementById('reply-form-' + this.dataset.id);
                    form.style.display = form.style.display === 'none' ? 'block' : 'none';
                });
            });
            list.querySelectorAll('.embycomments-reply-submit').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var parentId = this.dataset.id;
                    var body = document.getElementById('reply-text-' + parentId).value.trim();
                    if (!body) return;
                    fetch(apiEndpoint + '/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            MediaKey: currentMediaKey,
                            MediaTitle: '',
                            AuthorDisplayName: displayName,
                            OriginServerGuid: serverGuid,
                            Body: body,
                            StarRating: null,
                            ParentCommentId: parentId
                        })
                    }).then(function() {
                        document.getElementById('reply-text-' + parentId).value = '';
                        loadComments();
                    });
                });
            });
        }

        function renderComment(c, isReply) {
            var stars = c.StarRating ? '★'.repeat(c.StarRating) + ' (' + c.StarRating + '/10)' : '';
            var date = new Date(c.CreatedAt).toLocaleDateString();
            return '<div class="embycomments-comment' + (isReply ? ' reply' : '') + '">' +
                '<div class="embycomments-comment-header">' +
                '<span class="embycomments-author">' + escHtml(c.AuthorDisplayName) + '</span>' +
                '<span class="embycomments-date">' + date + '</span>' +
                '</div>' +
                (stars ? '<div class="embycomments-rating">' + stars + '</div>' : '') +
                '<div class="embycomments-body">' + escHtml(c.Body) + '</div>' +
                '<div class="embycomments-actions">' +
                '<button class="embycomments-action-btn embycomments-like-btn" data-id="' + c.CommentId + '">♥ ' + (c.LikeCount || 0) + '</button>' +
                (!isReply ? '<button class="embycomments-action-btn embycomments-reply-btn" data-id="' + c.CommentId + '">↩ Reply</button>' : '') +
                '</div>' +
                (!isReply ? '<div class="embycomments-reply-form" id="reply-form-' + c.CommentId + '">' +
                '<textarea id="reply-text-' + c.CommentId + '" placeholder="Write a reply..."></textarea><br>' +
                '<button class="embycomments-submit embycomments-reply-submit" data-id="' + c.CommentId + '">Post Reply</button>' +
                '</div>' : '') +
                '</div>';
        }

        function showError(msg) {
            var el = document.getElementById('embyCommentError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
