<div id="CommunityCommentsConfigPage"
     is="emby-scroller"
     class="view flex flex-direction-column scrollFrameY flex-grow"
     data-horizontal="false"
     data-forcescrollbar="true"
     data-centerfocus="true"
     data-bindheader="true"
     data-controller="__plugin/communitycommentsjs"
     data-title="Community Comments">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page scrollSliderY focuscontainer-y">
        <form id="CommunityCommentsConfigForm" class="auto-center">
            <div class="readOnlyContent auto-center">

                <h2>Community Comments Settings</h2>
                <p style="color: var(--theme-text-color-secondary, #aaa);">
                    Set the comment display name for each server user. Leave blank to default to their Emby username.
                </p>

                <div style="margin-bottom: 1.5em;">
                    <label style="display: flex; align-items: center; gap: 0.75em; cursor: pointer;">
                        <input type="checkbox" id="chkServerLocalOnly"
                               style="width: 18px; height: 18px; accent-color: var(--theme-primary-color, #52b54b); cursor: pointer;" />
                        <div>
                            <div style="font-weight: bold;">Server Local Comments Only</div>
                            <div style="font-size: 0.85em; color: var(--theme-text-color-secondary, #aaa);">
                                When enabled, only comments from users on this server are shown.
                            </div>
                        </div>
                    </label>
                </div>

                <div class="communityCommentsUserList" style="margin-bottom: 1.5em;">
                    <p style="color: var(--theme-text-color-secondary, #aaa);">Loading users...</p>
                </div>

                <div class="communityCommentsStatus" style="display:none; padding: 0.5em 0;"></div>

                <button is="emby-button" type="submit" class="raised button-submit block emby-button btnSaveAll" disabled>
                    <span>Save All</span>
                </button>

                <div class="ecActivityFeedSection" style="margin-top: 2em; display: none;">
                    <h3 style="margin-bottom: 0.5em;">Moderation Activity</h3>
                    <p style="font-size: 0.85em; color: var(--theme-text-color-secondary, #aaa); margin-bottom: 1em;">
                        Bans, unbans, AI moderation results, and comments flagged 3+ times.
                    </p>
                    <div class="ecActivityFeed" style="border: 1px solid var(--theme-border-color, #333); border-radius: 4px; max-height: 420px; overflow-y: auto;">
                        <p style="color: var(--theme-text-color-secondary, #aaa); padding: 1em; margin: 0;">Loading activity...</p>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5em;">
                        <button is="emby-button" class="emby-button btnLoadMoreActivity" style="font-size:0.85em; display:none;">
                            Load more
                        </button>
                        <span class="ecActivityFeedUpdated" style="font-size: 0.75em; color: var(--theme-text-color-secondary, #aaa);"></span>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
